name: Forecast cohort

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force_forecast:
        description: Run a forecast even if this three-hour slot already exists
        required: false
        default: false
        type: boolean
      series_id:
        description: Optionally run only this model series
        required: false
        type: string
      retry_run_id:
        description: Replay this invalid model run from its frozen input bundle
        required: false
        type: string
      retry_source_workflow_run:
        description: Workflow run containing the frozen cutoff snapshot
        required: false
        type: string
      recovery_issue_number:
        description: Model-failure issue to update after an automated replay
        required: false
        type: string
      replay_max_tokens:
        description: Optional audited output-ceiling increase for a truncated replay
        required: false
        type: string
      allow_second_replay:
        description: Explicitly permit replay #2 when replay #1 is invalid
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: foxhole-data-pipeline
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download frozen source data for a retry
        if: ${{ inputs.retry_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foxhole-forecast-data
          path: /tmp/foxhole-retry-source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.retry_source_workflow_run }}
      - name: Authorize the requested replay against its incident
        if: ${{ inputs.retry_run_id != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ISSUE_NUMBER: ${{ inputs.recovery_issue_number }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const runId = process.env.RETRY_RUN_ID;
            if (!Number.isInteger(issueNumber) || !runId) {
              throw new Error('A replay requires a model-failure issue and run ID.');
            }
            const issue = (await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            })).data;
            const labels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            );
            if (!labels.includes('model-failure') || !issue.body.includes('`' + runId + '`')) {
              throw new Error('The model-failure issue does not authorize this run ID.');
            }
      - name: Run the due three-hour forecast cohort
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SERIES_ID: ${{ inputs.series_id }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          RETRY_SOURCE_WORKFLOW_RUN: ${{ inputs.retry_source_workflow_run }}
          REPLAY_MAX_TOKENS: ${{ inputs.replay_max_tokens }}
        run: |
          mkdir -p .workflow
          if [[ -n "$RETRY_RUN_ID" ]]; then
            if [[ -z "$RETRY_SOURCE_WORKFLOW_RUN" ]]; then
              echo "retry_source_workflow_run is required for a retry" >&2
              exit 2
            fi
            cohort_id="${RETRY_RUN_ID%%:*}"
            series_id="${RETRY_RUN_ID#*:}"
            bundle="data/raw/cohorts/${cohort_id}/${series_id}-replay-bundle.json"
            if [[ -f "$bundle" ]]; then
              replay_args=(--run-id "$RETRY_RUN_ID" --allow-paid)
              if [[ "${{ inputs.allow_second_replay }}" == "true" ]]; then
                replay_args+=(--allow-second-replay)
              fi
              if [[ -n "$REPLAY_MAX_TOKENS" ]]; then
                if [[ ! "$REPLAY_MAX_TOKENS" =~ ^[0-9]+$ ]]; then
                  echo "replay_max_tokens must contain digits only" >&2
                  exit 2
                fi
                replay_args+=(--max-tokens "$REPLAY_MAX_TOKENS")
              fi
              PYTHONPATH=src python -m foxhole_forecast replay-run \
                "${replay_args[@]}" >/dev/null
            else
              PYTHONPATH=src python -m foxhole_forecast retry-run \
                --run-id "$RETRY_RUN_ID" \
                --snapshot /tmp/foxhole-retry-source/data/raw/latest.json >/dev/null
            fi
            PYTHONPATH=src python -m foxhole_forecast score >/dev/null
            PYTHONPATH=src python -m foxhole_forecast build-dashboard >/dev/null
            exit 0
          fi
          series_args=()
          if [[ -n "$SERIES_ID" ]]; then
            series_args+=(--series "$SERIES_ID")
          fi
          if [[ "${{ inputs.force_forecast }}" == "true" ]]; then
            PYTHONPATH=src python -m foxhole_forecast forecast --force "${series_args[@]}" \
              > .workflow/forecast-result.json
          else
            PYTHONPATH=src python -m foxhole_forecast forecast "${series_args[@]}" \
              > .workflow/forecast-result.json
          fi
          cohort_id="$(python -c 'import json; print(json.load(open(".workflow/forecast-result.json")).get("cohort_id", ""))')"
          if [[ -n "$cohort_id" && -z "$SERIES_ID" ]]; then
            PYTHONPATH=src python -m foxhole_forecast recover-model-runs \
              --cohort-id "$cohort_id" \
              --snapshot data/raw/latest.json \
              > .workflow/recovery-result.json
          else
            echo '{"status":"not_applicable","actions":[]}' > .workflow/recovery-result.json
          fi
          PYTHONPATH=src python -m foxhole_forecast score >/dev/null
          PYTHONPATH=src python -m foxhole_forecast build-dashboard >/dev/null
      - name: Pass generated data to the persistence job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxhole-forecast-data
          path: |
            data/cohorts.jsonl
            data/model_runs.jsonl
            data/objects
            data/raw/latest.json
            data/raw/cohorts
            data/state.json
            .workflow/forecast-result.json
            .workflow/recovery-result.json
          if-no-files-found: error
          retention-days: 90

  persist:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create repository-scoped data writer token
        id: data-writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_WRITER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Resolve data writer commit identity
        id: data-writer-identity
        env:
          GH_TOKEN: ${{ steps.data-writer-token.outputs.token }}
        run: |
          app_slug="${{ steps.data-writer-token.outputs.app-slug }}"
          user_id="$(gh api "/users/${app_slug}[bot]" --jq .id)"
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          token: ${{ steps.data-writer-token.outputs.token }}
      - name: Download generated data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foxhole-forecast-data
          path: .
      - name: Rebuild scores and dashboard with the checked-out source
        run: |
          PYTHONPATH=src python3 -m foxhole_forecast score >/dev/null
          PYTHONPATH=src python3 -m foxhole_forecast build-dashboard >/dev/null
      - name: Commit new forecasts and scores
        env:
          PERSIST_GIT_USER_NAME: ${{ steps.data-writer-token.outputs.app-slug }}[bot]
          PERSIST_GIT_USER_EMAIL: ${{ steps.data-writer-identity.outputs.user-id }}+${{ steps.data-writer-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          .github/scripts/persist-data.sh "data: update forecasts and scores"

  audit:
    needs: persist
    if: ${{ needs.persist.result == 'success' && inputs.series_id == '' && inputs.retry_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Download the exact forecast result from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foxhole-forecast-data
          path: .
      - name: Audit only the cohort created during this workflow run
        run: |
          cohort_id="$(python3 -c 'import json; print(json.load(open(".workflow/forecast-result.json")).get("cohort_id", ""))')"
          if [[ -z "$cohort_id" ]]; then
            echo '{"status":"no_new_cohort","audited_cohorts":[],"incidents":[]}' \
              > /tmp/model-run-audit.json
          else
            PYTHONPATH=src python3 -m foxhole_forecast audit-model-runs \
              --cohort-id "$cohort_id" > /tmp/model-run-audit.json
          fi
      - name: Record and dispatch missing-model incidents
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('/tmp/model-run-audit.json', 'utf8'));
            if (!audit.incidents.length) {
              core.info(`No missing model runs in ${audit.audited_cohorts.length} new cohort(s).`);
              return;
            }

            const labels = [
              ['model-failure', 'b60205', 'An expected model is absent from a forecast cohort'],
              ['agent-triage-running', 'd4a72c', 'Automated read-only diagnosis is in progress'],
              ['agent-triaged', '0e8a16', 'Automated read-only diagnosis completed'],
              ['agent-triage-failed', 'b60205', 'Automated diagnosis did not return a report'],
              ['agent-recovery-dispatched', 'd4a72c', 'A constrained frozen-data recovery was dispatched'],
              ['agent-recovered', '0e8a16', 'Automated frozen-data recovery succeeded'],
              ['agent-recovery-failed', 'b60205', 'Automated frozen-data recovery failed'],
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'model-failure',
              per_page: 100,
            });
            for (const incident of audit.incidents) {
              const title = `[model failure] ${incident.cohort_id}`;
              const failures = incident.failures.map((failure) => [
                `### ${failure.label}`,
                `- Series: \`${failure.series_id}\``,
                `- Run: \`${failure.run_id}\``,
                `- Detection: \`${failure.reason}\``,
                `- Stored status: \`${failure.status}\``,
                `- Stored predictions: ${failure.stored_prediction_count}`,
                `- Evidence path: \`${failure.raw_cohort_path}\``,
                failure.error ? `- Error excerpt: ${failure.error}` : '- Error excerpt: none stored',
              ].join('\n')).join('\n\n');
              const body = [
                '<!-- foxhole-model-failure -->',
                '@fh-eval — an enabled model is missing from a prediction round and needs attention.',
                '',
                'An enabled model is absent from this prediction round. This alert is not caused by individual dropped bets.',
                'Deterministic stored-response salvage and any rule-based retry were exhausted before this alert was opened.',
                '',
                `- War: ${incident.war_number ?? 'unknown'}`,
                `- Round slot: \`${incident.slot}\``,
                `- Data cutoff: \`${incident.cutoff}\``,
                `- Source workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                failures,
                '',
                'The agent cannot edit code or access GitHub credentials. It may recommend one frozen-data retry; a trusted workflow independently validates and executes that narrow action.',
              ].join('\n');

              let issue = allIssues.find((candidate) => candidate.title === title);
              if (!issue) {
                issue = (await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['model-failure', 'agent-triage-running'],
                  assignees: ['fh-eval'],
                })).data;
              } else {
                const names = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
                const assignees = (issue.assignees || []).map((assignee) => assignee.login);
                if (!assignees.includes('fh-eval')) {
                  issue = (await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: [...new Set([...assignees, 'fh-eval'])],
                  })).data;
                }
                if (names.includes('agent-triage-running') || names.includes('agent-triaged')) {
                  core.info(`Incident #${issue.number} already dispatched.`);
                  continue;
                }
                issue = (await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'open',
                  body,
                  labels: [...new Set([...names, 'model-failure', 'agent-triage-running'])],
                })).data;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'model-triage.yml',
                ref: 'main',
                inputs: {issue_number: String(issue.number)},
              });
              core.notice(`Dispatched Luna triage for issue #${issue.number}.`);
            }

            const failedModels = audit.incidents.reduce(
              (count, incident) => count + incident.failures.length,
              0,
            );
            core.setFailed(
              `${failedModels} enabled model run(s) remain unresolved across ` +
              `${audit.incidents.length} forecast cohort(s). See the model-failure issue(s).`,
            );

  recovery-report:
    needs: [evaluate, persist]
    if: ${{ always() && inputs.retry_run_id != '' && inputs.recovery_issue_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.persist.result == 'success' }}
        with:
          name: foxhole-forecast-data
          path: .
      - name: Report the exact recovered run
        if: ${{ needs.persist.result == 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ISSUE_NUMBER: ${{ inputs.recovery_issue_number }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          ALLOW_SECOND_REPLAY: ${{ inputs.allow_second_replay }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const runId = process.env.RETRY_RUN_ID;
            const allowSecondReplay = process.env.ALLOW_SECOND_REPLAY === 'true';
            if (!Number.isInteger(issueNumber) || !runId) {
              throw new Error('Recovery report inputs are invalid.');
            }
            const issue = (await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            })).data;
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            if (!labels.includes('model-failure') || !issue.body.includes('`' + runId + '`')) {
              throw new Error('Recovery issue does not authorize this run ID.');
            }
            const runs = fs.readFileSync('data/model_runs.jsonl', 'utf8')
              .split(/\r?\n/)
              .filter(Boolean)
              .map((line) => JSON.parse(line));
            const originals = runs.filter((run) => run.run_id === runId);
            if (originals.length !== 1) {
              throw new Error(`Expected one original run; found ${originals.length}.`);
            }
            const replays = runs.filter((run) => run.replay_of === runId);
            const expectedReplayCount = allowSecondReplay ? 2 : 1;
            if (replays.length !== expectedReplayCount) {
              throw new Error(`Expected ${expectedReplayCount} append-only replay(s); found ${replays.length}.`);
            }
            const run = replays[replays.length - 1];
            const predictionCount = (run.forecast?.predictions || []).length;
            const succeeded = run.status === 'valid' && predictionCount > 0;
            const maxTokens = run.replay_config_overrides?.max_tokens;
            const overrideNote = maxTokens
              ? `Replay configuration override: output ceiling ${maxTokens.frozen} → ${maxTokens.replay} tokens; frozen high-reasoning settings unchanged.`
              : 'Replay configuration override: none.';
            const label = succeeded ? 'agent-recovered' : 'agent-recovery-failed';
            const color = succeeded ? '0e8a16' : 'b60205';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color,
                description: succeeded
                  ? 'Automated frozen-data recovery succeeded'
                  : 'Automated frozen-data recovery failed',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [label],
            });
            const body = succeeded
              ? [
                  '## Automated recovery succeeded',
                  '',
                  `The trusted forecast workflow replayed \`${runId}\` from its verified frozen input bundle.`,
                  `Append-only replay: \`${run.run_id}\``,
                  overrideNote,
                  `The delayed replay contains ${predictionCount} valid prediction(s).`,
                  `Source workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join('\n')
              : [
                  '## Automated recovery did not succeed',
                  '',
                  `The one permitted frozen-input replay for \`${runId}\` remains invalid.`,
                  `Append-only replay: \`${run.run_id}\``,
                  overrideNote,
                  `Stored error: ${run.error || 'none recorded'}`,
                  'ChatGPT/Codex or human review is required; no further automatic retry will be attempted.',
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
            if (succeeded) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
              });
            }
      - name: Report recovery workflow failure
        if: ${{ needs.persist.result != 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ISSUE_NUMBER: ${{ inputs.recovery_issue_number }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber)) {
              throw new Error('Recovery issue number is invalid.');
            }
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'agent-recovery-failed',
                color: 'b60205',
                description: 'Automated frozen-data recovery failed',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['agent-recovery-failed'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '## Automated recovery workflow failed',
                '',
                `The trusted retry workflow for \`${process.env.RETRY_RUN_ID}\` did not reach persistence.`,
                `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'No additional automatic retry will be attempted; ChatGPT/Codex or human review is required.',
              ].join('\n'),
            });
