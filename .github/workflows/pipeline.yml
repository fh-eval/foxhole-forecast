name: Collect observations

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: foxhole-data-pipeline
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Collect official data, settle bets, and publish
        run: |
          PYTHONPATH=src python -m foxhole_forecast collect >/dev/null
          PYTHONPATH=src python -m foxhole_forecast score >/dev/null
          PYTHONPATH=src python -m foxhole_forecast build-dashboard >/dev/null
      - name: Pass generated data to the persistence job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxhole-collection-data
          path: |
            data/collector_runs.jsonl
            data/events.jsonl
            data/observations.jsonl
            data/observations
            data/raw/latest.json
            data/state.json
            data/wars.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
      - name: Download generated data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foxhole-collection-data
          # upload-artifact removes the shared `data/` parent from this
          # artifact. Keep the download isolated, then restore that parent
          # explicitly so a successful run cannot silently score stale data.
          path: /tmp/foxhole-collection-data
      - name: Restore generated data at its repository paths
        run: |
          test -f /tmp/foxhole-collection-data/collector_runs.jsonl
          test -f /tmp/foxhole-collection-data/raw/latest.json
          cp /tmp/foxhole-collection-data/collector_runs.jsonl data/collector_runs.jsonl
          cp /tmp/foxhole-collection-data/events.jsonl data/events.jsonl
          cp /tmp/foxhole-collection-data/observations.jsonl data/observations.jsonl
          cp -a /tmp/foxhole-collection-data/observations/. data/observations/
          cp /tmp/foxhole-collection-data/raw/latest.json data/raw/latest.json
          cp /tmp/foxhole-collection-data/state.json data/state.json
          cp /tmp/foxhole-collection-data/wars.json data/wars.json
      - name: Rebuild scores and dashboard with the checked-out source
        run: |
          PYTHONPATH=src python3 -m foxhole_forecast score >/dev/null
          PYTHONPATH=src python3 -m foxhole_forecast build-dashboard >/dev/null
      - name: Commit new observations and results
        run: |
          .github/scripts/persist-data.sh "data: update observations and scores"
