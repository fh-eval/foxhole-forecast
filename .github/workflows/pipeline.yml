name: Collect observations

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: foxhole-data-pipeline
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Collect official data, settle bets, and publish
        run: |
          PYTHONPATH=src python -m foxhole_forecast collect >/dev/null
          PYTHONPATH=src python -m foxhole_forecast score >/dev/null
          PYTHONPATH=src python -m foxhole_forecast build-dashboard >/dev/null
      - name: Pass generated data to the persistence job
        uses: actions/upload-artifact@v7
        with:
          name: foxhole-collection-data
          path: |
            data
            web/public/data/dashboard.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Download generated data
        uses: actions/download-artifact@v8
        with:
          name: foxhole-collection-data
          path: .
      - name: Rebuild dashboard with the checked-out source
        run: PYTHONPATH=src python3 -m foxhole_forecast build-dashboard >/dev/null
      - name: Commit new observations and results
        run: |
          git config user.name "foxhole-forecast[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No persisted changes"
          else
            git commit -m "data: update observations and scores"
            git fetch origin main
            git rebase origin/main
            git push
          fi
